version: 2

models:
  - name: fct_weather_sales_correlation
    description: "Gold — franchise review volume joined to its city's current weather snapshot (grain: franchise_id, review_month)."
    columns:
      - name: franchise_id
        description: Foreign key to stg_bakehouse__sales_franchises.franchise_id.
        data_tests:
          - not_null
      - name: franchise_name
        description: Human-readable display name of the franchise location.
      - name: city_key
        description: Lowercased/trimmed city name — join key for weather-by-city lookups.
      - name: review_month
        description: Calendar month (first-of-month date) the reviews were aggregated into.
      - name: review_count
        description: Number of customer reviews received by the franchise in the month.
      - name: avg_temperature_f
        description: City's average temperature across its observed weather window, in Fahrenheit.
      - name: avg_temperature_c
        description: City's average temperature across its observed weather window, in Celsius.
      - name: avg_humidity_pct
        description: City's average relative humidity across its observed weather window, as a percentage.
      - name: avg_precipitation_probability
        description: City's average precipitation probability across its observed weather window, as a percentage.

  - name: fct_weather_sales_ai_summary
    description: >
      Gold — fct_weather_sales_correlation enriched with an ai_query()
      generated one-sentence narrative per franchise/month (GenAI step).
    columns:
      - name: franchise_id
        description: Foreign key to stg_bakehouse__sales_franchises.franchise_id.
        data_tests:
          - not_null
      - name: franchise_name
        description: Human-readable display name of the franchise location.
      - name: city_key
        description: Lowercased/trimmed city name — join key for weather-by-city lookups.
      - name: review_month
        description: Calendar month (first-of-month date) the reviews were aggregated into.
      - name: review_count
        description: Number of customer reviews received by the franchise in the month.
      - name: avg_temperature_f
        description: City's average temperature across its observed weather window, in Fahrenheit.
      - name: avg_humidity_pct
        description: City's average relative humidity across its observed weather window, as a percentage.
      - name: weather_sales_insight
        description: One-sentence, human-readable narrative generated by ai_query() describing how weather may have influenced this franchise's review volume.
        data_tests:
          - not_null

  - name: fct_weather_review_correlation_by_franchise
    description: >
      Gold — per-franchise Pearson correlation coefficients (CORR()) between
      daily review sentiment/volume and daily weather, aligned by day_index
      rather than calendar date (grain: franchise_id). Only franchises with
      at least 3 matched days are included.
    columns:
      - name: franchise_id
        description: Foreign key to stg_bakehouse__sales_franchises.franchise_id (primary key of this mart).
        data_tests:
          - not_null
          - unique
      - name: franchise_name
        description: Human-readable display name of the franchise location.
      - name: city_key
        description: Lowercased/trimmed city name — join key for weather-by-city lookups.
      - name: matched_days
        description: Number of day_index-aligned day-pairs between the franchise's review timeline and its city's weather timeline, used to compute the correlations.
      - name: volume_temp_correlation
        description: Pearson correlation between daily review volume and daily temperature. Typically NULL/near-zero since review volume has almost no day-to-day variance (~1 review/day).
      - name: sentiment_temp_correlation
        description: Pearson correlation between daily average review sentiment score and daily temperature — the primary "does weather impact reviews?" signal.
      - name: sentiment_humidity_correlation
        description: Pearson correlation between daily average review sentiment score and daily humidity.
      - name: avg_daily_reviews
        description: Average number of reviews per matched day for this franchise.
      - name: avg_sentiment_score
        description: Average sentiment score (-1 to 1) across all matched days for this franchise.
      - name: avg_daily_temperature_f
        description: Average temperature across all matched days for this franchise's city, in Fahrenheit.
